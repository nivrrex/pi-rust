[workspace]
resolver = "2"
members = ["crates/pi-ai", "crates/pi-core", "crates/pi-cli", "crates/pi-tui", "tools/mock-provider"]

[workspace.package]
version = "0.87.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tokio-util = "0.7"
futures = "0.3"
# Q9 已获批准：TS 的 overflow 模式表逐字对齐需要它，见 notes/questions.md
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4", "v7"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tracing = "0.1"

[profile.release]
strip = true
