[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pi-ai = { path = "../pi-ai" }
pi-core = { path = "../pi-core" }
clap.workspace = true
tokio.workspace = true
serde.workspace = true
uuid.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
futures.workspace = true
pi-tui = { path = "../pi-tui" }
crossterm = "0.28"

[[bin]]
name = "pi-rs"
path = "src/main.rs"

[dev-dependencies]
# P7-4g：仅诊断用（examples/tui-screen-vt100.rs）；理由见 notes/decisions.md。
vt100 = "0.15"
tempfile.workspace = true

[features]
# P7-6p(续4)/W1：**诊断转储**（默认关闭；不进 default features、不进 precommit 默认构建）。
# 开启后 r3 路径把每帧喂给 `diff_render` 的行数组摘要（及超屏帧的完整 lines）写入文件，不写 stdout/stderr。
diag-frame-dump = []
